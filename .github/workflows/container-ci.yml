name: Container CI - Build Scan Push

on:
  push:
    branches:
      - main
    paths:
      - "problem-4-ecs/**"
      - ".github/workflows/container-ci.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: problem-4-ecs
        run: |
          docker build \
            -t devops-assessment-app:${GITHUB_SHA} \
            .

      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: devops-assessment-app:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false

      - name: Tag and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            devops-assessment-app:${IMAGE_TAG} \
            ${ECR_REGISTRY}/devops-assessment-app:${IMAGE_TAG}

          docker push \
            ${ECR_REGISTRY}/devops-assessment-app:${IMAGE_TAG}